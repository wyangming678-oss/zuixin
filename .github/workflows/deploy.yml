name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static site
        run: npm run build
      - name: Locate index.html
        run: |
          echo "=== dist tree ==="
          find dist -type f -name "index.html" 2>/dev/null | head -20
          echo "=== dist tree (all) ==="
          find dist -type f 2>/dev/null | head -30
      - name: Upload artifact
        run: |
          # 找到 index.html 所在目录并上传该目录
          IDX=$(find dist -type f -name "index.html" | head -1)
          if [ -z "$IDX" ]; then
            echo "❌ 找不到 index.html"
            exit 1
          fi
          DIR=$(dirname "$IDX")
          echo "Uploading $DIR"
          echo "artifact_path=$DIR" >> $GITHUB_OUTPUT
        id: locate
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.artifact_path }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
